.start-screen.show {
  animation: startFadeIn .35s ease both;
}

@keyframes startFadeIn {
  from {
    opacity: .92;
    transform: translateY(2px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

    /* ===== Smooth iOS PWA Boot Curtain ===== */
.boot-curtain {
  position: fixed;
  inset: 0;
  z-index: 999999;
  background:
    radial-gradient(circle at 50% 12%, rgba(34,211,238,.45), transparent 28%),
    radial-gradient(circle at 20% 22%, rgba(59,130,246,.34), transparent 26%),
    radial-gradient(circle at 84% 76%, rgba(168,85,247,.38), transparent 30%),
    linear-gradient(160deg, #0284c7 0%, #1d4ed8 45%, #5b21b6 100%);
  opacity: 1;
  pointer-events: none;
  transition: opacity .45s ease;
}

.boot-curtain.hide {
  opacity: 0;
}

.boot-curtain.remove {
  display: none;
}

.start-screen.show {
  animation: startFadeInSoft .36s ease both;
}

@keyframes startFadeInSoft {
  from {
    opacity: .96;
    transform: translateY(1px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}
    /* ===== Answer Tools + Better Buttons ===== */
.answer-row {
  align-items: center;
}

.answer-tools {
  display: flex;
  align-items: center;
  gap: 7px;
  flex: 0 0 auto;
}

.mini-btn {
  min-height: 34px;
  padding: 6px 12px;
}

.clear-mini-btn {
  background: rgba(255,255,255,.9);
  color: #334155;
}

.reveal-mini-btn {
  background: linear-gradient(135deg, #fee2e2, #fecaca);
  border-color: rgba(239,68,68,.28);
  color: #b91c1c;
  box-shadow: 0 8px 18px rgba(239,68,68,.12);
}

.reveal-mini-btn:active,
.clear-mini-btn:active {
  transform: scale(.96);
}

/* ปุ่มล่าง เหลือ ลบ + ส่งคำตอบ */
.action-row {
  display: grid;
  grid-template-columns: .8fr 2.2fr;
  gap: 10px;
  margin-top: 12px;
}

/* ปุ่มลบแบบ Pro */
.delete-btn {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  background:
    linear-gradient(180deg, #ffffff 0%, #f8fafc 48%, #e2e8f0 100%);
  color: #334155;
  border: 1px solid rgba(148,163,184,.45);
  box-shadow:
    0 10px 18px rgba(15,23,42,.10),
    inset 0 1px 0 rgba(255,255,255,.9);
}

.delete-btn span {
  font-size: .9rem;
  font-weight: 900;
}

.delete-btn:active {
  transform: scale(.97);
  box-shadow:
    0 5px 12px rgba(15,23,42,.10),
    inset 0 1px 0 rgba(255,255,255,.8);
}

.delete-icon {
  width: 23px;
  height: 23px;
  display: block;
  margin: 0;
}

/* ปุ่ม A B C U ให้เป็นเขียวอ่อน */
.symbol-btn.set-symbol {
  background: linear-gradient(180deg, #ecfdf5, #bbf7d0);
  border-color: rgba(34,197,94,.38);
  color: #14532d;
  box-shadow:
    0 8px 15px rgba(34,197,94,.14),
    inset 0 1px 0 rgba(255,255,255,.75);
}

.symbol-btn.set-symbol:active {
  transform: scale(.94);
  background: linear-gradient(180deg, #dcfce7, #86efac);
}
  </style>
</head>

function openGameDB(){return new Promise((resolve,reject)=>{if(!('indexedDB' in window)){reject(new Error('IndexedDB not supported'));return}const req=indexedDB.open(DB_NAME,DB_VERSION);req.onupgradeneeded=()=>{const db=req.result;if(!db.objectStoreNames.contains(DB_STORE))db.createObjectStore(DB_STORE)};req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error)})}
async function saveProgressToIDB(data){try{const db=await openGameDB();await new Promise((resolve,reject)=>{const tx=db.transaction(DB_STORE,'readwrite');tx.objectStore(DB_STORE).put(data,DB_PROGRESS_KEY);tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error)});db.close()}catch(e){console.warn('IndexedDB save failed:',e)}}
async function getProgressFromIDB(){try{const db=await openGameDB();const data=await new Promise((resolve,reject)=>{const tx=db.transaction(DB_STORE,'readonly');const req=tx.objectStore(DB_STORE).get(DB_PROGRESS_KEY);req.onsuccess=()=>resolve(req.result||null);req.onerror=()=>reject(req.error)});db.close();return data}catch(e){console.warn('IndexedDB read failed:',e);return null}}
async function clearProgressFromIDB(){try{const db=await openGameDB();await new Promise((resolve,reject)=>{const tx=db.transaction(DB_STORE,'readwrite');tx.objectStore(DB_STORE).delete(DB_PROGRESS_KEY);tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error)});db.close()}catch(e){console.warn('IndexedDB clear failed:',e)}}

function saveProgress(force=false){if(!force&&(!$('startScreen')||$('startScreen').classList.contains('show')))return;const data=buildProgressData();try{localStorage.setItem(SAVE_KEY,JSON.stringify(data))}catch(e){console.warn('localStorage save failed:',e)}saveProgressToIDB(data);updateContinueButton()}
function clearSavedProgress(){try{localStorage.removeItem(SAVE_KEY)}catch(e){}clearProgressFromIDB();updateContinueButton()}
async function updateContinueButton(){const btn=$('continueBtn');if(!btn)return;const data=await getSavedProgressAsync();if(data&&Number.isFinite(Number(data.currentIndex))){btn.style.display='block';btn.textContent=`เล่นต่อ ด่านที่ ${Number(data.currentIndex)+1}`}else{btn.style.display='none'}}

function isIOSStandalonePWA() {
  const isIOS =
    /iPad|iPhone|iPod/.test(navigator.userAgent) ||
    (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);

  const isStandalone =
    window.navigator.standalone === true ||
    window.matchMedia('(display-mode: standalone)').matches;

  return isIOS && isStandalone;
}

function smoothBootForIOSPWA() {
  const curtain = $('bootCurtain');

  // ถ้าไม่ใช่ iOS PWA ให้เอาฉากออกเร็ว ๆ
  if (!isIOSStandalonePWA()) {
    if (curtain) {
      curtain.classList.add('hide');
      setTimeout(() => curtain.classList.add('remove'), 360);
    }
    return;
  }

  const root = document.documentElement;
  const body = document.body;
  const scroller = document.scrollingElement || root;

  const oldScrollBehavior = root.style.scrollBehavior;
  const oldRootMinHeight = root.style.minHeight;
  const oldBodyMinHeight = body.style.minHeight;
  const oldOverflow = body.style.overflow;

  root.style.scrollBehavior = 'auto';
  root.style.minHeight = 'calc(100vh + 4px)';
  body.style.minHeight = 'calc(100vh + 4px)';
  body.style.overflow = 'hidden';

  // ให้ iOS มีเวลาสร้าง viewport ก่อน แล้วค่อย nudge ตอนยังมี curtain บังอยู่
  setTimeout(() => {
    requestAnimationFrame(() => {
      scroller.scrollTop = 1;

      setTimeout(() => {
        scroller.scrollTop = 0;

        root.style.scrollBehavior = oldScrollBehavior;
        root.style.minHeight = oldRootMinHeight;
        body.style.minHeight = oldBodyMinHeight;
        body.style.overflow = oldOverflow;

        if (curtain) {
          curtain.classList.add('hide');
          setTimeout(() => curtain.classList.add('remove'), 360);
        }
      }, 120);
    });
  }, 700);
} 

    
function init(){
  loadQuestion();
  updateModeUI();
  updateContinueButton();

  if ($('startVersion')) {
    $('startVersion').textContent = APP_VERSION;
  }

  smoothBootForIOSPWA();
}
    
function selectMode(mode){gameMode=mode;updateModeUI()}
function updateModeUI(){if($('easyModeBtn'))$('easyModeBtn').classList.toggle('active',gameMode==='easy');if($('hardModeBtn'))$('hardModeBtn').classList.toggle('active',gameMode==='hard');$('modeLabel').textContent=gameMode==='easy'?'โหมดฝึกหัด':'โหมดท้าทาย'}
function startGame(){currentIndex=0;score=0;combo=1;lives=START_LIVES;correctStreak=0;answerCards=[];clearSavedProgress();$('startScreen').classList.remove('show');loadQuestion();updateUI();saveProgress(true)}
async function continueGame(){const data=await getSavedProgressAsync();if(!data){startGame();return}currentIndex=Number(data.currentIndex)||0;score=Number(data.score)||0;combo=Number(data.combo)||1;lives=Number(data.lives)||START_LIVES;correctStreak=Number(data.correctStreak)||0;gameMode=data.gameMode||'easy';answerCards=Array.isArray(data.answerCards)?data.answerCards:[];$('startScreen').classList.remove('show');activeLevel=levels[currentIndex]||levels[0];$('diagram2').classList.toggle('diagram-active',activeLevel.mode===2);$('diagram3').classList.toggle('diagram-active',activeLevel.mode===3);targetSet=evaluate(activeLevel.expr);paint(targetSet);renderCardBank();renderAnswer();updateUI();saveProgress(true)}
function getIds(){return activeLevel.mode===2?ids2:ids3}
function getData(){return activeLevel.mode===2?data2:data3}
function renderCardBank(){
  cardBank.innerHTML = '';
  const allowed = activeLevel.allowed;
  document.documentElement.style.setProperty('--btn-count', allowed.length);

  allowed.forEach(symbol => {
    const btn = document.createElement('button');
    btn.className = 'symbol-btn';

    if (['A', 'B', 'C', 'U'].includes(symbol)) {
      btn.classList.add('set-symbol');
    }

    btn.textContent = symbol;
    btn.onclick = () => addCard(symbol);
    cardBank.appendChild(btn);
  });

  $('challengeLabel').textContent = activeLevel.tag
    ? `${activeLevel.tag}: ปุ่มถูกจำกัด`
    : 'แตะคำตอบเพื่อลบ';
}
function loadQuestion(){activeLevel=levels[currentIndex]||levels[0];answerCards=[];renderAnswer();$('diagram2').classList.toggle('diagram-active',activeLevel.mode===2);$('diagram3').classList.toggle('diagram-active',activeLevel.mode===3);targetSet=evaluate(activeLevel.expr);paint(targetSet);renderCardBank();updateUI();saveProgress()}
function addCard(symbol){answerCards.push(symbol);renderAnswer();saveProgress(true);if(navigator.vibrate)navigator.vibrate(18)}
function removeCard(index){answerCards.splice(index,1);renderAnswer();saveProgress(true);if(navigator.vibrate)navigator.vibrate(12)}
function backspaceAnswer(){if(!answerCards.length)return;answerCards.pop();renderAnswer();saveProgress(true);if(navigator.vibrate)navigator.vibrate(12)}
function renderAnswer(){answerZone.innerHTML='';if(!answerCards.length){answerZone.innerHTML='<span class="placeholder">แตะปุ่มสัญลักษณ์ด้านล่าง</span>';return}answerCards.forEach((symbol,index)=>{const token=document.createElement('span');token.className='expr-token';token.textContent=symbol;token.onclick=()=>removeCard(index);answerZone.appendChild(token)})}
function clearAnswer(){answerCards=[];renderAnswer();saveProgress(true)}
function revealAnswer(){if(lives<=0){showWrongCard('หัวใจไม่พอ','การดูเฉลยต้องใช้หัวใจ 1 ดวง');return}modalAction='revealConfirm';$('modalEmoji').textContent='⚠️';$('modalTitle').textContent='ยืนยันการดูเฉลย?';$('modalText').textContent='ถ้าดูเฉลย จะเสียหัวใจ 1 ดวง และ Streak จะเริ่มนับใหม่';$('modalButton').style.display='block';$('modalButton').textContent='ยืนยันเฉลย';$('modalCancel').style.display='block';$('modalCancel').textContent='ยกเลิก';$('modalExit').style.display='none';$('confetti').innerHTML='';$('overlay').classList.add('show')}
function confirmReveal(){if(lives<=0){$('overlay').classList.remove('show');showWrongCard('หัวใจไม่พอ','การดูเฉลยต้องใช้หัวใจ 1 ดวง');return}lives=Math.max(lives-1,0);combo=1;correctStreak=0;updateUI();saveProgress(true);const answerText=(activeLevel.show||activeLevel.expr).join(' ');modalAction=lives===0?'revealNoLives':'reveal';$('modalEmoji').textContent='👀';$('modalTitle').textContent='เฉลย';$('modalText').innerHTML=`<span class="reveal-answer-note">เสียหัวใจ 1 ดวง</span><span class="reveal-answer-box"><span class="reveal-answer-label">ตัวอย่างคำตอบ</span><span class="reveal-answer-text">${answerText}</span></span>`;$('modalButton').style.display='block';$('modalButton').textContent='ปิด';$('modalCancel').style.display='none';$('modalExit').style.display='none';$('confetti').innerHTML='';$('overlay').classList.add('show')}
function checkAnswer(){if(!answerCards.length){showWrongCard('ยังไม่ได้เลือกคำตอบ','แตะปุ่มสัญลักษณ์ด้านล่างเพื่อสร้างนิพจน์ก่อนนะ');shake(answerZone);return}let userSet;try{userSet=evaluate(answerCards)}catch(e){showWrongCard('นิพจน์ยังไม่สมบูรณ์','ลองตรวจวงเล็บและตำแหน่งของเครื่องหมายอีกครั้ง');shake(answerZone);return}if(equalSets(userSet,targetSet)){score+=10*combo;combo=Math.min(combo+1,5);correctStreak++;const gotBonusHeart=correctStreak%5===0;if(gotBonusHeart)lives++;updateUI();saveProgress(true);if(navigator.vibrate)navigator.vibrate([30,30,30]);showCorrectCard((activeLevel.show||activeLevel.expr).join(' '),gotBonusHeart)}else{lives=Math.max(lives-1,0);combo=1;correctStreak=0;updateUI();saveProgress(true);shake(answerZone);if(navigator.vibrate)navigator.vibrate(80);if(lives===0)setTimeout(()=>handleNoLives(),250);else showWrongCard('ยังไม่ถูกต้อง','ลองสังเกตพื้นที่แรเงา แล้วเรียงนิพจน์ใหม่อีกครั้ง')}}
function handleNoLives(){if(gameMode==='easy'){lives=START_LIVES;combo=1;correctStreak=0;answerCards=[];renderAnswer();updateUI();saveProgress(true);showPracticeCard()}else showGameOver()}
function nextQuestion(){currentIndex=(currentIndex+1)%levels.length;if(currentIndex===0){showFinishCard();clearSavedProgress();return}loadQuestion();saveProgress(true)}
function updateUI(){$('comboText').textContent=`⭐ ${score} • Combo x${combo}`;if(lives<=HEART_ICON_LIMIT){$('lifeText').textContent='❤️'.repeat(lives)+'🤍'.repeat(HEART_ICON_LIMIT-lives)}else{$('lifeText').textContent=`${lives} ❤️`}$('levelText').textContent=`ด่านที่ ${currentIndex+1} / ${levels.length}`;progressBar.style.width=((currentIndex+1)/levels.length*100)+'%';updateModeUI()}
function paint(setObj){const suffix=activeLevel.mode===2?'2':'3';getIds().forEach(id=>{const el=$(id+suffix);if(setObj[id]){el.classList.add('on');el.classList.remove('off')}else{el.classList.remove('on');el.classList.add('off')}})}
function equalSets(a,b){return getIds().every(id=>!!a[id]===!!b[id])}
function evaluate(tokens){let pos=0,ids=getIds(),data=getData();function parseUnion(){let left=parseInter();while(tokens[pos]==='∪'){pos++;left=op(left,parseInter(),'∪')}return left}function parseInter(){let left=parseComp();while(tokens[pos]==='∩'||tokens[pos]==='−'){const o=tokens[pos++];left=op(left,parseComp(),o)}return left}function parseComp(){let v=parsePrimary();while(tokens[pos]==='′'){pos++;v=comp(v)}return v}function parsePrimary(){const t=tokens[pos];if(!t)throw Error('missing');const vars=activeLevel.mode===2?['A','B','U']:['A','B','C','U'];if(vars.includes(t)){pos++;return base(t)}if(t==='('){pos++;const v=parseUnion();if(tokens[pos]!==')')throw Error('paren');pos++;return v}throw Error('bad')}const r=parseUnion();if(pos<tokens.length)throw Error('extra');return r;function base(s){const r={};ids.forEach(id=>{r[id]=s==='U'?true:data[id][s]});return r}function comp(a){const r={};ids.forEach(id=>r[id]=!a[id]);return r}function op(a,b,o){const r={};ids.forEach(id=>{if(o==='∪')r[id]=a[id]||b[id];if(o==='∩')r[id]=a[id]&&b[id];if(o==='−')r[id]=a[id]&&!b[id]});return r}}
function showCorrectCard(answerText,gotBonusHeart=false){$('modalCancel').style.display='none';$('modalExit').style.display='none';modalAction='none';$('modalEmoji').textContent=gotBonusHeart?'❤️':'🎉';$('modalTitle').textContent=gotBonusHeart?'ถูกต้อง! ได้หัวใจเพิ่ม':'ถูกต้อง!';$('modalText').textContent=gotBonusHeart?`ตอบถูกครบ 5 ข้อติดกัน ได้หัวใจเพิ่ม 1 ดวง • ตัวอย่างคำตอบ: ${answerText}`:`ตัวอย่างคำตอบ: ${answerText}`;$('modalButton').style.display='none';makeConfetti();$('overlay').classList.add('show');clearTimeout(autoNextTimer);autoNextTimer=setTimeout(()=>{$('overlay').classList.remove('show');nextQuestion()},1350)}
function showWrongCard(title,message){$('modalCancel').style.display='none';$('modalExit').style.display='none';modalAction='wrong';$('modalEmoji').textContent='🤔';$('modalTitle').textContent=title;$('modalText').textContent=message;$('modalButton').style.display='block';$('modalButton').textContent='ลองใหม่';$('confetti').innerHTML='';$('overlay').classList.add('show')}
function showPracticeCard(){$('modalCancel').style.display='none';$('modalExit').style.display='none';modalAction='practice';$('modalEmoji').textContent='💡';$('modalTitle').textContent='ลองใหม่อีกครั้ง';$('modalText').textContent='ระบบเติมหัวใจให้แล้ว อยู่ข้อเดิมเพื่อฝึกให้เข้าใจก่อนนะ';$('modalButton').style.display='block';$('modalButton').textContent='ลองต่อ';$('confetti').innerHTML='';$('overlay').classList.add('show')}
function showGameOver(){$('modalCancel').style.display='none';$('modalExit').style.display='none';modalAction='restart';$('modalEmoji').textContent='🏁';$('modalTitle').textContent='Game Over';$('modalText').textContent=`คะแนนของคุณคือ ${score} คะแนน`;$('modalButton').style.display='block';$('modalButton').textContent='เริ่มใหม่';$('confetti').innerHTML='';$('overlay').classList.add('show')}
function showGameMenu(){modalAction='menu';$('modalEmoji').textContent='⚙️';$('modalTitle').textContent='VENN Quest';$('modalText').innerHTML=`<div>ตอนนี้อยู่ด่านที่ ${currentIndex+1} • คะแนน ${score} คะแนน</div><div class="modal-credit">${APP_VERSION} • ${APP_POWERED_BY}</div>`;$('modalButton').style.display='block';$('modalButton').textContent='เริ่มเกมใหม่';$('modalExit').style.display='block';$('modalExit').textContent='ออกจากเกม / เลือกโหมด';$('modalCancel').style.display='block';$('modalCancel').textContent='เล่นต่อ';$('confetti').innerHTML='';$('overlay').classList.add('show')}
function exitToStartScreen(){$('overlay').classList.remove('show');$('modalCancel').style.display='none';$('modalExit').style.display='none';modalAction='';saveProgress(true);$('startScreen').classList.add('show');updateContinueButton()}
function handleModalButton(){if(modalAction==='revealConfirm'){confirmReveal();return}$('overlay').classList.remove('show');$('modalCancel').style.display='none';$('modalExit').style.display='none';if(modalAction==='menu'){currentIndex=0;score=0;combo=1;lives=START_LIVES;correctStreak=0;answerCards=[];clearSavedProgress();loadQuestion();updateUI();saveProgress(true);return}if(modalAction==='revealNoLives'){setTimeout(()=>handleNoLives(),120);return}if(modalAction==='finish'){$('startScreen').classList.add('show');updateContinueButton();return}if(modalAction==='wrong'||modalAction==='practice'||modalAction==='reveal')return;if(modalAction==='restart'){currentIndex=0;score=0;combo=1;lives=START_LIVES;correctStreak=0;answerCards=[];clearSavedProgress();loadQuestion();updateUI();saveProgress(true)}}
function showFinishCard(){$('modalCancel').style.display='none';$('modalExit').style.display='none';modalAction='finish';$('modalEmoji').textContent='🏆';$('modalTitle').textContent='จบเกม!';$('modalText').textContent=`คุณผ่านครบ 100 ด่านแล้ว คะแนนรวม ${score} คะแนน`;$('modalButton').style.display='block';$('modalButton').textContent='กลับหน้าเริ่ม';makeConfetti();$('overlay').classList.add('show')}
function closeOverlayOnly(){$('overlay').classList.remove('show');$('modalCancel').style.display='none';$('modalExit').style.display='none';modalAction=''}
function makeConfetti(){const box=$('confetti');box.innerHTML='';const colors=['#2563eb','#7c3aed','#16a34a','#f59e0b','#ef4444'];for(let i=0;i<42;i++){const c=document.createElement('i');c.style.left=Math.random()*100+'%';c.style.background=colors[i%colors.length];c.style.animationDelay=(Math.random()*.45)+'s';c.style.transform=`rotate(${Math.random()*180}deg)`;box.appendChild(c)}}
function shake(el){el.animate([{transform:'translateX(0)'},{transform:'translateX(-8px)'},{transform:'translateX(8px)'},{transform:'translateX(0)'}],{duration:240})}
function emergencySaveProgress(){if($('startScreen')&&!$('startScreen').classList.contains('show'))saveProgress(true)}
window.addEventListener('pagehide',emergencySaveProgress);
window.addEventListener('beforeunload',emergencySaveProgress);
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden')emergencySaveProgress()});
init();
if('serviceWorker' in navigator){window.addEventListener('load',()=>{navigator.serviceWorker.register('./service-worker.js').catch(err=>console.warn('Service Worker registration failed:',err))})}

  </script>
</body>
