<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#1d4ed8" />
  <link rel="manifest" href="./manifest.json">

<link rel="apple-touch-icon" href="./assets/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="VENN Quest">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<meta name="mobile-web-app-capable" content="yes">
<meta name="application-name" content="VENN Quest">
  <title>Venn Quest | 100 Levels</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root{
      --bg:#edf5ff;
      --bg2:#f5f0ff;
      --ink:#0f172a;
      --muted:#64748b;
      --primary:#2563eb;
      --primary2:#7c3aed;
      --good:#16a34a;
      --bad:#dc2626;
      --warn:#f59e0b;
      --line:rgba(148,163,184,.38);
      --shadow:0 18px 45px rgba(37,99,235,.16);
      --btn-count:10;
    }

    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    html,body{min-height:100%}
    body{
      margin:0;
      font-family:"Kanit",system-ui,sans-serif;
      color:var(--ink);
      overflow:auto;
      background:
        radial-gradient(circle at 15% 0%,rgba(37,99,235,.22),transparent 32%),
        radial-gradient(circle at 90% 8%,rgba(124,58,237,.20),transparent 34%),
        linear-gradient(135deg,var(--bg),var(--bg2));
    }

    .app{
      min-height:100dvh;
      display:flex;
      flex-direction:column;
      max-width:560px;
      margin:0 auto;
      position:relative;
      background:rgba(255,255,255,.12);
      padding-bottom:calc(12px + env(safe-area-inset-bottom));
    }

    .topbar{
      padding:calc(10px + env(safe-area-inset-top)) 14px 10px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
      flex:0 0 auto;
    }
    .brand{display:flex;align-items:center;gap:10px;min-width:0}
    .logo{
      width:42px;height:42px;border-radius:16px;
      display:grid;place-items:center;
      color:#fff;font-weight:800;font-size:1.16rem;
      background:linear-gradient(135deg,var(--primary),var(--primary2));
      box-shadow:0 12px 28px rgba(37,99,235,.28);
      flex:0 0 auto;
    }
    .game-logo {
  width: 46px;
  height: 46px;
  border-radius: 14px;
  overflow: hidden;
  flex: 0 0 auto;
  background: linear-gradient(135deg, #2563eb, #7c3aed);
  box-shadow:
    0 12px 28px rgba(37,99,235,.28),
    0 0 18px rgba(34,211,238,.22);
  border: 1px solid rgba(255,255,255,.65);
}

.game-logo img {
  width: 100%;
  height: 100%;
  display: block;
  object-fit: cover;
}
    .brand-title{font-size:1.05rem;font-weight:800;line-height:1.05;white-space:nowrap}
    .brand-sub{font-size:.78rem;color:var(--muted);margin-top:2px;white-space:nowrap}
    .score-life{display:flex;align-items:center;gap:6px;flex:0 0 auto}
    .scorebox{
      display:flex;align-items:center;gap:5px;
      background:rgba(255,255,255,.84);
      border:1px solid var(--line);
      border-radius:999px;
      padding:7px 9px;
      box-shadow:0 10px 26px rgba(15,23,42,.08);
      white-space:nowrap;
      font-weight:800;
      font-size:.94rem;
    }
    .menu-btn {
  width: 38px;
  height: 38px;
  border: 1px solid var(--line);
  border-radius: 999px;
  background: rgba(255,255,255,.86);
  color: #334155;
  font-family: "Kanit";
  font-size: 1.15rem;
  font-weight: 800;
  box-shadow: 0 10px 26px rgba(15,23,42,.08);
  cursor: pointer;
}

.menu-btn:active {
  transform: scale(.95);
}
    .scorebox span{color:var(--primary)}
    .life-box span{color:inherit;font-size:.9rem;letter-spacing:-2px}

    .progress-wrap{padding:0 14px 8px;flex:0 0 auto}
    .progress-meta{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:.78rem;margin-bottom:6px;font-weight:700}
    .progress{height:10px;background:rgba(226,232,240,.95);border-radius:999px;overflow:hidden;border:1px solid rgba(255,255,255,.75)}
    .progress-bar{height:100%;width:0%;background:linear-gradient(90deg,var(--primary),var(--primary2));border-radius:999px;transition:.25s ease}

    .game-scroll{flex:1 1 auto;padding:0 14px 10px;overflow:visible}
    .venn-card{
      background:rgba(255,255,255,.88);
      border:1px solid var(--line);
      border-radius:28px;
      min-height:330px;
      display:grid;
      place-items:center;
      padding:10px;
      box-shadow:var(--shadow);
      position:relative;
      overflow:hidden;
    }
    .venn-card:before{
      content:"";
      position:absolute;
      inset:0;
      background:repeating-linear-gradient(45deg,rgba(37,99,235,.035) 0 10px,transparent 10px 20px);
    }
    svg{width:100%;max-width:500px;height:auto;position:relative;z-index:1;display:none}
    .diagram-active{display:block}
    .universe{fill:#fff;stroke:#475569;stroke-width:2.5}
    .region{stroke:none;transition:fill .22s ease}
    .region.on{fill:rgba(37,99,235,.62)}
    .region.off{fill:rgba(226,232,240,.84)}
    .circle-outline{fill:none;stroke:rgba(15,23,42,.76);stroke-width:3}
    .label{font-size:31px;font-weight:800;fill:#0f172a}

    .answer-strip{margin-top:10px}
    .answer-row{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:7px;padding:0 2px}
    .answer-title{font-size:.9rem;font-weight:800;color:#334155}
    .mini-btn{
      border:none;border-radius:999px;background:rgba(255,255,255,.75);color:#334155;
      padding:6px 10px;font-family:"Kanit";font-weight:800;font-size:.76rem;cursor:pointer;
      border:1px solid var(--line);
    }
    .expression-box{
      min-height:64px;
      border:2px solid rgba(37,99,235,.30);
      background:rgba(239,246,255,.86);
      border-radius:20px;
      padding:10px 12px;
      display:flex;
      align-items:center;
      flex-wrap:wrap;
      gap:4px;
      font-family:"Times New Roman","Cambria Math","STIX Two Math",serif;
      font-size:1.85rem;
      font-weight:800;
      box-shadow:0 10px 26px rgba(15,23,42,.07);
    }
    .expr-token{display:inline-flex;align-items:center;justify-content:center;min-width:22px;padding:0 2px;cursor:pointer;border-radius:8px}
    .expr-token:active{background:rgba(245,158,11,.16);transform:scale(.94)}
    .placeholder{font-family:"Kanit",sans-serif;color:#64748b;font-size:.92rem;font-weight:600}

    .bottom-panel{
      position:relative;
      margin:0 14px 10px;
      padding:10px 12px 12px;
      background:rgba(255,255,255,.88);
      backdrop-filter:blur(20px);
      border:1px solid rgba(148,163,184,.38);
      box-shadow:0 14px 34px rgba(15,23,42,.10);
      border-radius:24px;
      z-index:5;
    }
    .bank-head{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px}
    .bank-head strong{font-size:.96rem}
    .bank-head span{font-size:.76rem;color:var(--muted);font-weight:600}
    .button-bank{display:grid;grid-template-columns:repeat(var(--btn-count),1fr);gap:5px}
    .symbol-btn{
      border:1px solid rgba(148,163,184,.30);
      height:40px;
      border-radius:13px;
      background:#fff;
      color:#0f172a;
      font-family:"Times New Roman","Cambria Math","STIX Two Math",serif;
      font-size:1.2rem;
      font-weight:800;
      box-shadow:0 8px 16px rgba(15,23,42,.09);
      cursor:pointer;
      touch-action:manipulation;
      display:grid;
      place-items:center;
      line-height:1;
    }
    .symbol-btn:active{transform:scale(.94);box-shadow:0 4px 10px rgba(15,23,42,.10)}
    .action-row{display:grid;grid-template-columns:.75fr .95fr 1.55fr;gap:8px;margin-top:9px}
    .action-btn{border:none;border-radius:18px;min-height:48px;padding:10px 12px;font-family:"Kanit";font-size:1rem;font-weight:800;cursor:pointer;touch-action:manipulation}
    .action-btn:active{transform:scale(.98)}
    .backspace-btn{background:#f8fafc;color:#334155;border:1px solid var(--line)}
    .delete-btn{background:linear-gradient(180deg,#ffffff,#f8fafc);color:#334155;border:1px solid rgba(148,163,184,.45);box-shadow:0 8px 16px rgba(15,23,42,.08)}
    .delete-icon{width:22px;height:22px;display:block;margin:0 auto}
    .reveal-btn{background:linear-gradient(135deg,#ef4444,#b91c1c);color:#fff;box-shadow:0 12px 24px rgba(239,68,68,.22)}
    .submit-btn{color:white;background:linear-gradient(135deg,var(--primary),var(--primary2));box-shadow:0 12px 24px rgba(37,99,235,.22)}

    .overlay,.start-screen{
      position:absolute;
      inset:0;
      z-index:20;
      display:none;
      place-items:center;
      background:rgba(15,23,42,.28);
      backdrop-filter:blur(8px);
      padding:18px;
    }
    .overlay.show,.start-screen.show{display:grid;animation:fadeIn .18s ease}
   /* ===== Reveal Answer Highlight ===== */
#modalText {
  display: block;
}

.reveal-answer-note {
  display: block;
  color: #64748b;
  font-family: "Kanit", sans-serif;
  font-size: 1rem;
  font-weight: 600;
  margin-bottom: 10px;
}

.reveal-answer-box {
  display: block;
  width: 100%;
  box-sizing: border-box;
  margin-top: 10px;
  padding: 16px 14px;
  border-radius: 20px;
  background: linear-gradient(135deg, #eff6ff, #f5f3ff);
  border: 2px solid rgba(37, 99, 235, .28);
  box-shadow: 0 14px 30px rgba(37, 99, 235, .14);
}

.reveal-answer-label {
  display: block;
  font-family: "Kanit", sans-serif;
  font-size: .86rem;
  font-weight: 900;
  color: #2563eb;
  margin-bottom: 8px;
}

.reveal-answer-text {
  display: block;
  width: 100%;
  font-family: "Times New Roman", "Cambria Math", serif;
  font-size: 2.25rem;
  font-weight: 900;
  color: #0f172a;
  line-height: 1.15;
  text-align: center;
  word-break: keep-all;
}
    .modal,.start-card{
      width:min(100%,390px);
      background:#fff;
      border-radius:30px;
      padding:22px;
      text-align:center;
      box-shadow:0 30px 80px rgba(15,23,42,.24);
      animation:pop .32s ease;
    }
    .modal-emoji,.start-logo{font-size:3.4rem;line-height:1}
    .start-logo{width:76px;height:76px;border-radius:26px;margin:0 auto 10px;display:grid;place-items:center;color:#fff;background:linear-gradient(135deg,var(--primary),var(--primary2));font-weight:800;box-shadow:0 18px 36px rgba(37,99,235,.25)}
    .modal h2,.start-card h1{margin:8px 0 4px;font-size:1.55rem}
    .modal p,.start-card p{margin:0;color:#64748b;line-height:1.45}
    .modal .modal-btn,.start-btn{margin-top:16px;width:100%;border:none;border-radius:17px;min-height:50px;padding:10px 12px;font-family:"Kanit";font-size:1rem;font-weight:800;cursor:pointer;color:white;background:linear-gradient(135deg,var(--primary),var(--primary2));box-shadow:0 12px 24px rgba(37,99,235,.22)}
    
    .modal .modal-cancel{margin-top:8px;width:100%;border:1px solid var(--line);border-radius:17px;min-height:46px;padding:10px 12px;font-family:"Kanit";font-size:.95rem;font-weight:800;cursor:pointer;color:#334155;background:#f8fafc}
   .modal-exit {
  margin-top: 8px;
  width: 100%;
  border: 1px solid rgba(239, 68, 68, .28);
  border-radius: 17px;
  min-height: 46px;
  padding: 10px 12px;
  font-family: "Kanit";
  font-size: .95rem;
  font-weight: 800;
  cursor: pointer;
  color: #b91c1c;
  background: #fff1f2;
}
    .mode-grid{display:grid;grid-template-columns:1fr;gap:10px;margin-top:18px}
   







    .confetti{position:absolute;inset:0;pointer-events:none;overflow:hidden}
    .confetti i{position:absolute;width:9px;height:16px;border-radius:4px;top:-20px;animation:fall 1.4s linear forwards;background:var(--primary)}
.delete-btn {
  background: linear-gradient(180deg, #ffffff, #f8fafc);
  color: #334155;
  border: 1px solid rgba(148,163,184,.45);
  box-shadow: 0 8px 16px rgba(15,23,42,.08);
}

.delete-icon {
  width: 22px;
  height: 22px;
  display: block;
  margin: 0 auto;
}
    @keyframes fadeIn{from{opacity:0}to{opacity:1}}
    @keyframes pop{from{transform:scale(.88) translateY(14px);opacity:.4}to{transform:scale(1) translateY(0);opacity:1}}
    @keyframes fall{to{transform:translateY(105dvh) rotate(420deg);opacity:.95}}

    @media (min-width:720px){body{padding:16px}.app{min-height:calc(100dvh - 32px);border-radius:36px;overflow:hidden;box-shadow:0 30px 90px rgba(15,23,42,.14)}}
    @media (max-width:390px){.venn-card{min-height:305px}.expression-box{min-height:58px;font-size:1.65rem}.symbol-btn{height:38px;font-size:1.05rem;border-radius:12px}.button-bank{gap:4px}.life-box span{font-size:.82rem}.scorebox{padding:7px 8px}.action-btn{min-height:46px}}
  /* ===== VENN Quest Splash / Start Screen ===== */
.start-screen {
  background:
    radial-gradient(circle at 50% 12%, rgba(34,211,238,.45), transparent 28%),
    radial-gradient(circle at 20% 22%, rgba(59,130,246,.34), transparent 26%),
    radial-gradient(circle at 84% 76%, rgba(168,85,247,.38), transparent 30%),
    linear-gradient(160deg, #0284c7 0%, #1d4ed8 45%, #5b21b6 100%);
  overflow: hidden;
}

.start-screen::before {
  content: "";
  position: absolute;
  inset: -20%;
  background:
    repeating-conic-gradient(
      from 0deg,
      rgba(255,255,255,.08) 0deg 5deg,
      transparent 5deg 16deg
    );
  opacity: .18;
  animation: splashRays 18s linear infinite;
  pointer-events: none;
  z-index: 0;
}

.start-screen::after {
  content: "✦  •  ✧  •  ✦";
  position: absolute;
  inset: auto 0 8%;
  text-align: center;
  color: rgba(255,255,255,.65);
  font-size: 1.4rem;
  letter-spacing: 18px;
  pointer-events: none;
  z-index: 0;
}

.start-card {
  width: min(100%, 390px);
  padding: 18px;
  background: transparent;
  border: none;
  box-shadow: none;
  backdrop-filter: none;
  color: #fff;
  animation: pop .32s ease;
  position: relative;
  z-index: 2;
  pointer-events: auto;
}

.start-card button,
.start-btn,
.mode-card {
  position: relative;
  z-index: 3;
  pointer-events: auto;
  touch-action: manipulation;
}


.splash-icon-wrap {
   width: min(66vw, 240px);
  aspect-ratio: 1 / 1;
  margin: 0 auto 18px;
  border-radius: 32px;
  padding: 0;
  background: transparent;
  border: none;
  box-shadow:
    0 28px 70px rgba(15,23,42,.38),
    0 0 54px rgba(34,211,238,.30);
}

.splash-icon {
  width: 100%;
  height: 100%;
  display: block;
  object-fit: cover;
  border-radius: 28px;
  box-shadow: 0 18px 35px rgba(15,23,42,.28);
}

.start-card h1 {
  margin: 6px 0 2px;
  font-size: clamp(2rem, 8vw, 3.25rem);
  line-height: .98;
  font-weight: 900;
  letter-spacing: -1px;
  color: #fff;
  text-shadow:
    0 4px 0 rgba(30,64,175,.75),
    0 14px 28px rgba(15,23,42,.35);
}

.start-card .quest-word {
  color: #fde047;
  text-shadow:
    0 4px 0 rgba(180,83,9,.9),
    0 14px 28px rgba(15,23,42,.35);
}

.start-card p {
  margin: 10px auto 0;
  max-width: 310px;
  color: rgba(255,255,255,.86);
  font-size: .94rem;
  line-height: 1.45;
}

.splash-badges {
  display: flex;
  justify-content: center;
  gap: 8px;
  flex-wrap: wrap;
  margin: 14px 0 2px;
}

.splash-badge {
  border-radius: 999px;
  padding: 6px 10px;
  background: rgba(255,255,255,.18);
  border: 1px solid rgba(255,255,255,.26);
  color: #fff;
  font-size: .76rem;
  font-weight: 800;
}





.start-btn {
  min-height: 54px;
  border-radius: 20px;
  font-size: 1.05rem;
}

#continueBtn {
  background: linear-gradient(135deg, #22c55e, #16a34a) !important;
}

@keyframes splashRays {
  from { transform: rotate(0deg); }
  to { transform: rotate(360deg); }
}

.mode-grid {
  display: grid;
  grid-template-columns: 1fr;
  gap: 10px;
  margin-top: 18px;
}

.mode-card {
  position: relative;
  width: 100%;
  min-height: 56px;
  padding: 10px 18px;
  border: 2px solid rgba(255,255,255,.55);
  border-radius: 999px;
  background: rgba(255,255,255,.92);
  color: #0f172a;
  font-family: "Kanit";
  text-align: center;
  cursor: pointer;
  transition: .18s ease;
  box-shadow: 0 8px 18px rgba(15,23,42,.10);
  touch-action: manipulation;

  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
}

.mode-card strong {
  display: block;
  font-size: 1.05rem;
  font-weight: 800;
  line-height: 1.1;
  color: #0f172a;
  text-align: center;
}

.mode-card span {
  display: block;
  font-size: .84rem;
  font-weight: 600;
  line-height: 1.15;
  color: #64748b;
  margin-top: 3px;
  text-align: center;
}

.mode-card.active {
  background: linear-gradient(135deg, #fff4b8, #facc15);
  border-color: rgba(255,255,255,.98);
  color: #3f2a05;
  box-shadow:
    0 14px 30px rgba(250,204,21,.30),
    0 0 18px rgba(253,224,71,.30),
    inset 0 1px 0 rgba(255,255,255,.72);
  transform: translateY(-1px);
}

.mode-card.active strong,
.mode-card.active span {
  color: #3f2a05;
}

.mode-card:active {
  transform: scale(.98);
}

.mode-card.active:active {
  transform: translateY(-1px) scale(.98);
}
.app-credit {
  margin-top: 12px;
  text-align: center;
  color: rgba(255,255,255,.82);
  font-size: .72rem;
  font-weight: 600;
  line-height: 1.45;
  text-shadow: 0 2px 8px rgba(15,23,42,.30);
  pointer-events: none;
}

.app-credit div:first-child {
  color: rgba(255,255,255,.96);
  font-weight: 800;
  letter-spacing: .3px;
}
    .modal-credit {
  margin-top: 8px;
  color: #64748b;
  font-size: .78rem;
  font-weight: 700;
}
  </style>
</head>

  </div>

</section>

        <svg id="diagram2" class="diagram-active" viewBox="0 0 620 400" role="img" aria-label="แผนภาพเวนน์ 2 เซต">

    function init(){
  loadQuestion();

    $('startVersion').textContent = APP_VERSION;
  }
}
    function selectMode(mode){gameMode=mode;updateModeUI();saveProgress()}
    function updateModeUI(){
      if($('easyModeBtn'))$('easyModeBtn').classList.toggle('active',gameMode==='easy');
      if($('hardModeBtn'))$('hardModeBtn').classList.toggle('active',gameMode==='hard');
      $('modeLabel').textContent=gameMode==='easy'?'โหมดฝึกหัด':'โหมดท้าทาย';
    }
    function startGame(){currentIndex=0;score=0;combo=1;lives=START_LIVES;correctStreak=0;answerCards=[];clearSavedProgress();$('startScreen').classList.remove('show');loadQuestion();updateUI();saveProgress()}

    function continueGame(){
      const data=getSavedProgress();
      if(!data){startGame();return}
      currentIndex=Number(data.currentIndex)||0;
      score=Number(data.score)||0;
      combo=Number(data.combo)||1;
      lives=Number(data.lives)||START_LIVES;
      correctStreak=Number(data.correctStreak)||0;
      gameMode=data.gameMode||'easy';
      answerCards=Array.isArray(data.answerCards)?data.answerCards:[];
      $('startScreen').classList.remove('show');
      activeLevel=levels[currentIndex]||levels[0];
      $('diagram2').classList.toggle('diagram-active',activeLevel.mode===2);
      $('diagram3').classList.toggle('diagram-active',activeLevel.mode===3);
      targetSet=evaluate(activeLevel.expr);
      paint(targetSet);
      renderCardBank();
      renderAnswer();
      updateUI();
      saveProgress();
    }
    function getIds(){return activeLevel.mode===2?ids2:ids3}
    function getData(){return activeLevel.mode===2?data2:data3}

    function renderCardBank(){
      cardBank.innerHTML='';
      const allowed=activeLevel.allowed;
      document.documentElement.style.setProperty('--btn-count', allowed.length);
      allowed.forEach(symbol=>{
        const btn=document.createElement('button');
        btn.className='symbol-btn';
        btn.textContent=symbol;
        btn.onclick=()=>addCard(symbol);
        cardBank.appendChild(btn);
      });
      $('challengeLabel').textContent=activeLevel.tag ? `${activeLevel.tag}: ปุ่มถูกจำกัด` : 'แตะคำตอบเพื่อลบ';
    }

    function loadQuestion(){
      activeLevel=levels[currentIndex];
      answerCards=[];
      renderAnswer();
      $('diagram2').classList.toggle('diagram-active',activeLevel.mode===2);
      $('diagram3').classList.toggle('diagram-active',activeLevel.mode===3);
      targetSet=evaluate(activeLevel.expr);
      paint(targetSet);
      renderCardBank();
      updateUI();
      saveProgress();
    }

    function addCard(symbol){answerCards.push(symbol);renderAnswer();saveProgress();if(navigator.vibrate)navigator.vibrate(18)}
    function removeCard(index){answerCards.splice(index,1);renderAnswer();saveProgress();if(navigator.vibrate)navigator.vibrate(12)}
    function backspaceAnswer(){if(!answerCards.length)return;answerCards.pop();renderAnswer();saveProgress();if(navigator.vibrate)navigator.vibrate(12)}
    function renderAnswer(){
      answerZone.innerHTML='';
      if(!answerCards.length){answerZone.innerHTML='<span class="placeholder">แตะปุ่มสัญลักษณ์ด้านล่าง</span>';return}
      answerCards.forEach((symbol,index)=>{const token=document.createElement('span');token.className='expr-token';token.textContent=symbol;token.onclick=()=>removeCard(index);answerZone.appendChild(token)})
    }
    function clearAnswer(){answerCards=[];renderAnswer();saveProgress()}

    function revealAnswer(){
      if(lives<=0){
        showWrongCard('หัวใจไม่พอ','การดูเฉลยต้องใช้หัวใจ 1 ดวง');
        return;
      }
      modalAction='revealConfirm';
      $('modalEmoji').textContent='⚠️';
      $('modalTitle').textContent='ยืนยันการดูเฉลย?';
      $('modalText').textContent='ถ้าดูเฉลย จะเสียหัวใจ 1 ดวง และ Streak จะเริ่มนับใหม่';
      $('modalButton').style.display='block';
      $('modalButton').textContent='ยืนยันเฉลย';
      $('modalCancel').style.display='block';
      $('modalCancel').textContent='ยกเลิก';
      $('confetti').innerHTML='';
      $('overlay').classList.add('show');
    }

    function confirmReveal(){
      if(lives<=0){
        $('overlay').classList.remove('show');
        showWrongCard('หัวใจไม่พอ','การดูเฉลยต้องใช้หัวใจ 1 ดวง');
        return;
      }
      lives=Math.max(lives-1,0);
      combo=1;
      correctStreak=0;
      updateUI();
      saveProgress();
      const answerText=(activeLevel.show||activeLevel.expr).join(' ');
      modalAction=lives===0?'revealNoLives':'reveal';
      $('modalEmoji').textContent='👀';
      $('modalTitle').textContent='เฉลย';
$('modalText').innerHTML = `
  <span class="reveal-answer-note">เสียหัวใจ 1 ดวง</span>
  <span class="reveal-answer-box">
    <span class="reveal-answer-label">ตัวอย่างคำตอบ</span>
    <span class="reveal-answer-text">${answerText}</span>
  </span>
`;
      $('modalButton').style.display='block';
      $('modalButton').textContent='ปิด';
      $('modalCancel').style.display='none';
      $('confetti').innerHTML='';
      $('overlay').classList.add('show');
    }

    function checkAnswer(){
      if(!answerCards.length){showWrongCard('ยังไม่ได้เลือกคำตอบ','แตะปุ่มสัญลักษณ์ด้านล่างเพื่อสร้างนิพจน์ก่อนนะ');shake(answerZone);return}
      let userSet;
      try{userSet=evaluate(answerCards)}catch(e){showWrongCard('นิพจน์ยังไม่สมบูรณ์','ลองตรวจวงเล็บและตำแหน่งของเครื่องหมายอีกครั้ง');shake(answerZone);return}
      if(equalSets(userSet,targetSet)){
        score+=10*combo;
        combo=Math.min(combo+1,5);
        correctStreak++;
        const gotBonusHeart = correctStreak % 5 === 0;
        if(gotBonusHeart) lives++;
        updateUI();
        saveProgress();
        if(navigator.vibrate)navigator.vibrate([30,30,30]);
        showCorrectCard((activeLevel.show||activeLevel.expr).join(' '), gotBonusHeart);
      }else{
        lives=Math.max(lives-1,0);
        combo=1;
        correctStreak=0;
        updateUI();
        saveProgress();
        shake(answerZone);
        if(navigator.vibrate)navigator.vibrate(80);
        if(lives===0)setTimeout(()=>handleNoLives(),250);
        else showWrongCard('ยังไม่ถูกต้อง','ลองสังเกตพื้นที่แรเงา แล้วเรียงนิพจน์ใหม่อีกครั้ง');
      }
    }

    function handleNoLives(){
      if(gameMode==='easy'){
        lives=START_LIVES;combo=1;correctStreak=0;answerCards=[];renderAnswer();updateUI();saveProgress();showPracticeCard();
      }else showGameOver();
    }
    function nextQuestion(){
      currentIndex=(currentIndex+1)%levels.length;
      if(currentIndex===0){
        showFinishCard();
        clearSavedProgress();
        return;
      }
      loadQuestion();
    }
    function updateUI(){
$('comboText').textContent=`⭐ ${score} • Combo x${combo}`;
      if(lives<=HEART_ICON_LIMIT){
        $('lifeText').textContent='❤️'.repeat(lives)+'🤍'.repeat(HEART_ICON_LIMIT-lives);
      }else{
        $('lifeText').textContent=`${lives} ❤️`;
      }
      $('levelText').textContent=`ด่านที่ ${currentIndex+1} / ${levels.length}`;
      progressBar.style.width=((currentIndex+1)/levels.length*100)+'%';
      updateModeUI();
    }

    function paint(setObj){
      const suffix=activeLevel.mode===2?'2':'3';
      getIds().forEach(id=>{
        const el=$(id+suffix);
        if(setObj[id]){el.classList.add('on');el.classList.remove('off')}
        else{el.classList.remove('on');el.classList.add('off')}
      });
    }
    function equalSets(a,b){return getIds().every(id=>!!a[id]===!!b[id])}

    function evaluate(tokens){
      let pos=0,ids=getIds(),data=getData();
      function parseUnion(){let left=parseInter();while(tokens[pos]==='∪'){pos++;left=op(left,parseInter(),'∪')}return left}
      function parseInter(){let left=parseComp();while(tokens[pos]==='∩'||tokens[pos]==='−'){const o=tokens[pos++];left=op(left,parseComp(),o)}return left}
      function parseComp(){let v=parsePrimary();while(tokens[pos]==='′'){pos++;v=comp(v)}return v}
      function parsePrimary(){
        const t=tokens[pos];
        if(!t)throw Error('missing');
        const vars=activeLevel.mode===2?['A','B','U']:['A','B','C','U'];
        if(vars.includes(t)){pos++;return base(t)}
        if(t==='('){pos++;const v=parseUnion();if(tokens[pos]!==')')throw Error('paren');pos++;return v}
        throw Error('bad');
      }
      const r=parseUnion();
      if(pos<tokens.length)throw Error('extra');
      return r;
      function base(s){const r={};ids.forEach(id=>{r[id]=s==='U'?true:data[id][s]});return r}
      function comp(a){const r={};ids.forEach(id=>r[id]=!a[id]);return r}
      function op(a,b,o){const r={};ids.forEach(id=>{if(o==='∪')r[id]=a[id]||b[id];if(o==='∩')r[id]=a[id]&&b[id];if(o==='−')r[id]=a[id]&&!b[id]});return r}
    }

    function showCorrectCard(answerText, gotBonusHeart=false){
      $('modalCancel').style.display='none';
      modalAction='none';
      $('modalEmoji').textContent=gotBonusHeart?'❤️':'🎉';
      $('modalTitle').textContent=gotBonusHeart?'ถูกต้อง! ได้หัวใจเพิ่ม':'ถูกต้อง!';
      $('modalText').textContent=gotBonusHeart?`ตอบถูกครบ 5 ข้อติดกัน ได้หัวใจเพิ่ม 1 ดวง • ตัวอย่างคำตอบ: ${answerText}`:`ตัวอย่างคำตอบ: ${answerText}`;
      $('modalButton').style.display='none';
      $('modalExit').style.display = 'none';
      makeConfetti();
      $('overlay').classList.add('show');
      clearTimeout(autoNextTimer);
      autoNextTimer=setTimeout(()=>{$('overlay').classList.remove('show');nextQuestion()},1350);
    }
    function showWrongCard(title,message){
      $('modalCancel').style.display='none';
      modalAction='wrong';
      $('modalEmoji').textContent='🤔';
      $('modalTitle').textContent=title;
      $('modalText').textContent=message;
      $('modalButton').style.display='block';
      $('modalButton').textContent='ลองใหม่';
      $('confetti').innerHTML='';
      $('overlay').classList.add('show');
      $('modalExit').style.display = 'none';
    }
    function showPracticeCard(){
      $('modalCancel').style.display='none';
      modalAction='practice';
      $('modalEmoji').textContent='💡';
      $('modalTitle').textContent='ลองใหม่อีกครั้ง';
      $('modalText').textContent='ระบบเติมหัวใจให้แล้ว อยู่ข้อเดิมเพื่อฝึกให้เข้าใจก่อนนะ';
      $('modalButton').style.display='block';
      $('modalButton').textContent='ลองต่อ';
      $('modalExit').style.display = 'none';
      $('confetti').innerHTML='';
      $('overlay').classList.add('show');
    }
    function showGameOver(){
      $('modalCancel').style.display='none';
      modalAction='restart';
      $('modalEmoji').textContent='🏁';
      $('modalTitle').textContent='Game Over';
      $('modalText').textContent=`คะแนนของคุณคือ ${score} คะแนน`;
      $('modalButton').style.display='block';
      $('modalButton').textContent='เริ่มใหม่';
      $('modalExit').style.display = 'none';
      $('confetti').innerHTML='';
      $('overlay').classList.add('show');
    }

function showGameMenu() {
  modalAction = 'menu';
  $('modalEmoji').textContent = '⚙️';
  $('modalTitle').textContent = 'VENN Quest';
  $('modalText').innerHTML = `
  <div>ตอนนี้อยู่ด่านที่ ${currentIndex + 1} • คะแนน ${score} คะแนน</div>
  <div class="modal-credit">${APP_VERSION} • ${APP_POWERED_BY}</div>
`;

  $('modalButton').style.display = 'block';
  $('modalButton').textContent = 'เริ่มเกมใหม่';

  $('modalExit').style.display = 'block';
  $('modalExit').textContent = 'ออกจากเกม / เลือกโหมด';

  $('modalCancel').style.display = 'block';
  $('modalCancel').textContent = 'เล่นต่อ';

  $('confetti').innerHTML = '';
  $('overlay').classList.add('show');
}

    function exitToStartScreen() {
  $('overlay').classList.remove('show');
  $('modalCancel').style.display = 'none';
  $('modalExit').style.display = 'none';
  modalAction = '';

  saveProgress();
  $('startScreen').classList.add('show');
  updateContinueButton();
}

    function handleModalButton(){
  if(modalAction==='revealConfirm'){
    confirmReveal();
    return;
  }

  $('overlay').classList.remove('show');
  $('modalCancel').style.display='none';

  if (modalAction === 'menu') {
    currentIndex = 0;
    score = 0;
    combo = 1;
    lives = START_LIVES;
    correctStreak = 0;
    answerCards = [];
    clearSavedProgress();
    loadQuestion();
    updateUI();
    saveProgress();
    return;
  }

  if(modalAction==='revealNoLives'){
    setTimeout(()=>handleNoLives(),120);
    return;
  }

  if(modalAction==='finish'){
    $('startScreen').classList.add('show');
    updateContinueButton();
    return;
  }

  if(modalAction==='wrong'||modalAction==='practice'||modalAction==='reveal')return;

  if(modalAction==='restart'){
    currentIndex=0;
    score=0;
    combo=1;
    lives=START_LIVES;
    correctStreak=0;
    answerCards=[];
    clearSavedProgress();
    loadQuestion();
    updateUI();
    saveProgress();
  }
}
    function showFinishCard(){
      $('modalCancel').style.display='none';
      modalAction='finish';
      $('modalEmoji').textContent='🏆';
      $('modalTitle').textContent='จบเกม!';
      $('modalText').textContent=`คุณผ่านครบ 100 ด่านแล้ว คะแนนรวม ${score} คะแนน`;
      $('modalButton').style.display='block';
      $('modalButton').textContent='กลับหน้าเริ่ม';
      $('modalExit').style.display = 'none';
      makeConfetti();
      $('overlay').classList.add('show');
    }

    function getSavedProgress(){
      try{return JSON.parse(localStorage.getItem(SAVE_KEY)||'null')}catch(e){return null}
    }
    function saveProgress(){
      if(!$('startScreen') || $('startScreen').classList.contains('show')) return;
      const data={currentIndex,score,combo,lives,correctStreak,gameMode,answerCards,updatedAt:Date.now()};
      try{localStorage.setItem(SAVE_KEY,JSON.stringify(data));updateContinueButton()}catch(e){}
    }
    function clearSavedProgress(){
      try{localStorage.removeItem(SAVE_KEY);updateContinueButton()}catch(e){}
    }
    function updateContinueButton(){
      const btn=$('continueBtn');
      if(!btn) return;
      const data=getSavedProgress();
      if(data && Number.isFinite(Number(data.currentIndex))){
        btn.style.display='block';
        btn.textContent=`เล่นต่อ ด่านที่ ${Number(data.currentIndex)+1}`;
      }else{
        btn.style.display='none';
      }
    }

function closeOverlayOnly(){
  $('overlay').classList.remove('show');
  $('modalCancel').style.display='none';
  $('modalExit').style.display='none';
  modalAction='';
}

    function makeConfetti(){
      const box=$('confetti');box.innerHTML='';
      const colors=['#2563eb','#7c3aed','#16a34a','#f59e0b','#ef4444'];
      for(let i=0;i<42;i++){
        const c=document.createElement('i');
        c.style.left=Math.random()*100+'%';
        c.style.background=colors[i%colors.length];
        c.style.animationDelay=(Math.random()*.45)+'s';
        c.style.transform=`rotate(${Math.random()*180}deg)`;
        box.appendChild(c);
      }
    }
    function shake(el){el.animate([{transform:'translateX(0)'},{transform:'translateX(-8px)'},{transform:'translateX(8px)'},{transform:'translateX(0)'}],{duration:240})}

    init();
    if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./service-worker.js')
        .catch(err => console.warn('Service Worker registration failed:', err));
    });
  }
  </script>
</body>
